name: ZeroVault
options:
  bundleIdPrefix: com.zerovault
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

targets:
  ZeroVault:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ZeroVault
        excludes:
          - "App/Info.plist"
    info:
      path: ZeroVault/App/Info.plist
      properties:
        CFBundleDisplayName: ZeroVault
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_NAME: ZeroVault
        PRODUCT_BUNDLE_IDENTIFIER: com.zerovault.app
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ZeroVault/App/Info.plist
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1" # iPhone
