<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e599" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#04060a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1522"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e599"/>
      <stop offset="50%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#00e599"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#141c2b"/>
      <stop offset="100%" stop-color="#070a0f"/>
    </linearGradient>
    <linearGradient id="padlockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e599"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Ambient Radial Halo -->
  <circle cx="256" cy="256" r="210" fill="url(#halo)"/>

  <!-- Cyber Shield Body -->
  <path d="M 256,76 L 410,126 L 410,266 C 410,366 256,436 256,436 C 256,436 102,366 102,266 L 102,126 Z"
        fill="url(#shieldFill)"
        stroke="url(#shieldBorder)"
        stroke-width="7"
        stroke-linejoin="round"
        filter="url(#neonGlow)"/>

  <!-- Inner Shackle -->
  <path d="M 206,242 L 206,204 C 206,176 228,154 256,154 C 284,154 306,176 306,204 L 306,242"
        fill="none"
        stroke="#00d2ff"
        stroke-width="12"
        stroke-linecap="round"/>

  <!-- Padlock Housing -->
  <rect x="180" y="238" width="152" height="122" rx="20"
        fill="url(#padlockGrad)"
        stroke="#ffffff"
        stroke-width="2"
        filter="url(#neonGlow)"/>

  <!-- Keyhole -->
  <circle cx="256" cy="286" r="14" fill="#06090e"/>
  <polygon points="251,296 261,296 264,332 248,332" fill="#06090e"/>
</svg>
