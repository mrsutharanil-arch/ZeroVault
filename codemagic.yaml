workflows:
  ios-release:
    name: Build ZeroVault iOS App
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Build IPA without Code Signing
        script: |
          chmod +x ./package_ipa.sh
          ./package_ipa.sh
    artifacts:
      - build/ZeroVault.ipa
      - build/*.xcarchive
