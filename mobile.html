<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ZeroVault Mobile</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #06090e;
      --card: #101622;
      --border: #1e2738;
      --emerald: #00e599;
      --cyan: #00d2ff;
      --red: #ff3b5c;
      --purple: #b56cff;
      --text: #f0f6fc;
      --muted: #8b949e;
      --mono: 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom) 16px;
    }

    /* LOCK SCREEN */
    .lock-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 20px 0;
      text-align: center;
    }
    .vault-emblem {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: #111722;
      border: 2px solid var(--emerald);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      box-shadow: 0 0 25px rgba(0, 229, 153, 0.25);
      overflow: hidden;
    }
    .vault-title { font-family: var(--mono); font-size: 22px; font-weight: 800; letter-spacing: 3px; }
    .vault-sub { font-family: var(--mono); font-size: 10px; color: var(--emerald); letter-spacing: 2px; margin-bottom: 24px; }
    
    .pin-dots { display: flex; gap: 14px; margin-bottom: 24px; }
    .dot { width: 14px; height: 14px; border-radius: 50%; background: #212936; border: 1px solid rgba(0,229,153,0.3); transition: all 0.2s; }
    .dot.filled { background: var(--emerald); box-shadow: 0 0 10px var(--emerald); transform: scale(1.15); }

    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; width: 100%; max-width: 280px; margin-bottom: 20px; }
    .key-btn {
      height: 68px; border-radius: 50%; background: #131924; border: 1px solid #252e3d;
      color: #fff; font-size: 26px; font-weight: 500; display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .key-btn:active { background: #252e3d; transform: scale(0.92); }

    /* VAULT MAIN */
    .main-view { display: none; flex-direction: column; flex: 1; padding-bottom: 80px; }
    .main-view.active { display: flex; }
    .lock-container.hidden { display: none; }

    .nav-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 0 14px 0; }
    .nav-title { font-family: var(--mono); font-size: 17px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .nav-title img { width: 24px; height: 24px; border-radius: 6px; }
    
    .stat-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px; margin-bottom: 12px;
    }
    .stat-size { font-size: 24px; font-weight: 800; margin-bottom: 2px; }
    .stat-meta { font-size: 10px; color: var(--emerald); font-family: var(--mono); }

    .chips-row { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 10px; padding-bottom: 4px; }
    .chip { padding: 6px 14px; border-radius: 20px; background: #131924; border: 1px solid var(--border); font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
    .chip.active { background: rgba(0,229,153,0.15); border-color: var(--emerald); color: var(--emerald); }

    /* VIEW OPTIONS (GRID VS LIST & GROUPING) */
    .view-controls {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
    }
    .mode-btn {
      padding: 4px 10px; border-radius: 6px; background: #131924; border: 1px solid var(--border); color: var(--muted); font-size: 11px; font-weight: 700; cursor: pointer;
    }
    .mode-btn.active { background: rgba(0,229,153,0.2); color: var(--emerald); border-color: var(--emerald); }

    .group-header {
      font-family: var(--mono); font-size: 10px; font-weight: 800; color: var(--emerald); letter-spacing: 1px;
      display: flex; justify-content: space-between; margin: 12px 0 6px 0;
    }

    /* GRID LAYOUT (3-COL) */
    .media-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px;
    }
    .grid-card {
      aspect-ratio: 1; border-radius: 10px; background: #0f1520; border: 1px solid var(--border);
      display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; cursor: pointer;
    }
    .grid-card .icon { font-size: 24px; margin-bottom: 4px; }
    .grid-card .label { font-size: 9px; font-weight: 600; color: #fff; padding: 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; text-align: center; }
    .grid-card .badge {
      position: absolute; bottom: 3px; right: 3px; font-size: 7px; font-family: var(--mono); font-weight: 800; background: rgba(0,0,0,0.75); color: #fff; padding: 2px 4px; border-radius: 3px;
    }

    /* LIST LAYOUT */
    .file-card {
      display: flex; align-items: center; gap: 12px; background: #0f1520; border: 1px solid var(--border);
      border-radius: 14px; padding: 12px; margin-bottom: 8px; cursor: pointer;
    }
    .file-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .file-info { flex: 1; min-width: 0; }
    .file-title { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-meta-sub { font-size: 10px; color: var(--muted); font-family: var(--mono); margin-top: 2px; }

    .bottom-dock {
      position: fixed; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, #06090e 85%, transparent);
      padding: 12px 16px env(safe-area-inset-bottom) 16px; display: flex; gap: 10px; z-index: 100;
    }
    .dock-btn {
      flex: 1; padding: 14px; border-radius: 14px; font-weight: 800; font-size: 13px;
      display: flex; align-items: center; justify-content: center; gap: 8px; border: none; cursor: pointer;
    }
    .dock-btn.cam { background: #151c28; color: #fff; border: 1px solid var(--border); }
    .dock-btn.add { background: var(--emerald); color: #000; box-shadow: 0 4px 15px rgba(0,229,153,0.3); }

    /* MODAL */
    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 200; display: none;
      flex-direction: column; padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom) 16px;
    }
    .modal.open { display: flex; }
    .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; }
    .modal-body { flex: 1; overflow-y: auto; background: #111722; border-radius: 12px; padding: 16px; font-family: var(--mono); font-size: 12px; line-height: 1.6; }
  </style>
</head>
<body>

  <!-- LOCK VIEW -->
  <div id="lockView" class="lock-container">
    <div class="vault-emblem" onclick="triggerFaceID()">
      <img src="logo.png" alt="ZeroVault" style="width:100%; height:100%; border-radius:50%; object-fit:cover;"/>
    </div>
    <div class="vault-title">ZEROVAULT</div>
    <div class="vault-sub">OWNER-ONLY ACCESS</div>

    <div class="pin-dots">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>

    <div class="keypad" id="keypad"></div>

    <div style="font-family:var(--mono); font-size:9px; color:var(--muted); letter-spacing:1px; margin-top:10px;">
      MASTER PIN: <span id="hintMasterPin" style="color:var(--emerald);">123456</span> • TAP 👤 FOR FACE ID
    </div>
  </div>

  <!-- MAIN VAULT VIEW -->
  <div id="mainView" class="main-view">
    <div class="nav-bar">
      <div class="nav-title"><img src="logo.png" alt="Logo"/> ZEROVAULT</div>
      <div style="display:flex; gap:6px;">
        <button onclick="openChangePinModal()" style="background:#131924; border:1px solid var(--border); color:#fff; padding:6px 10px; border-radius:8px; font-size:12px;">🔑 PIN</button>
        <button onclick="lockVault()" style="background:rgba(255,59,92,0.15); border:1px solid rgba(255,59,92,0.3); color:var(--red); padding:6px 10px; border-radius:8px; font-size:12px; font-weight:700;">🔒 Lock</button>
      </div>
    </div>

    <div class="stat-card">
      <div style="font-family:var(--mono); font-size:9px; color:var(--muted); letter-spacing:1px; margin-bottom:4px;">SOVEREIGN STORAGE (EXCLUDED FROM BACKUP)</div>
      <div class="stat-size" id="statSize">34.8 MB</div>
      <div class="stat-meta">5 ENCRYPTED ITEMS • AIR-GAPPED</div>
    </div>

    <div class="chips-row">
      <div class="chip active" onclick="filterCat('all', this)">All Files</div>
      <div class="chip" onclick="filterCat('photos', this)">Photos</div>
      <div class="chip" onclick="filterCat('videos', this)">Videos</div>
      <div class="chip" onclick="filterCat('docs', this)">Documents</div>
      <div class="chip" onclick="filterCat('notes', this)">Notes</div>
    </div>

    <!-- VIEW CONTROLS -->
    <div class="view-controls">
      <div style="display:flex; gap:4px;">
        <span class="mode-btn active" onclick="setGrouping('date', this)">By Date</span>
        <span class="mode-btn" onclick="setGrouping('type', this)">By Type</span>
      </div>
      <div style="display:flex; gap:4px;">
        <span id="btnGrid" class="mode-btn active" onclick="setLayout('grid')">⊞ Grid</span>
        <span id="btnList" class="mode-btn" onclick="setLayout('list')">☰ List</span>
      </div>
    </div>

    <div id="fileContainer"></div>

    <div class="bottom-dock">
      <button class="dock-btn cam" onclick="captureSecurePhoto()">📷 Secure Cam</button>
      <button class="dock-btn add" onclick="triggerFileAdd()">➕ Add File</button>
    </div>
  </div>

  <!-- VIEWER / GALLERY SWIPER MODAL -->
  <div id="viewerModal" class="modal">
    <div class="modal-head">
      <h3 id="modalTitle" style="font-size:14px; font-weight:700;">File Preview</h3>
      <button onclick="closeModal()" style="background:none; border:none; color:var(--emerald); font-weight:700; font-size:13px;">Close & Wipe</button>
    </div>
    <div class="modal-body" id="modalBody" style="display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;"></div>
    <div style="display:flex; justify-content:space-between; align-items:center; padding:12px 0;">
      <button onclick="prevGallery()" style="background:#131924; border:1px solid var(--border); color:#fff; padding:8px 16px; border-radius:8px;">◀ Prev</button>
      <span id="galleryCounter" style="font-family:var(--mono); font-size:11px; color:var(--emerald);">1 of 5</span>
      <button onclick="nextGallery()" style="background:#131924; border:1px solid var(--border); color:#fff; padding:8px 16px; border-radius:8px;">Next ▶</button>
    </div>
  </div>

  <!-- PIN CHANGE MODAL -->
  <div id="pinModal" class="modal">
    <div class="modal-head">
      <h3 style="font-size:15px; font-weight:700;">Change Master PIN</h3>
      <button onclick="closePinModal()" style="background:none; border:none; color:#888; font-size:13px;">Cancel</button>
    </div>
    <div style="display:flex; flex-direction:column; gap:12px; padding-top:10px;">
      <input type="password" id="oldPin" maxlength="6" placeholder="Current 6-digit PIN" style="padding:12px; background:#141a24; border:1px solid var(--border); color:#fff; border-radius:8px; text-align:center; font-size:18px; font-family:var(--mono);">
      <input type="password" id="newPin" maxlength="6" placeholder="New 6-digit PIN" style="padding:12px; background:#141a24; border:1px solid var(--border); color:#fff; border-radius:8px; text-align:center; font-size:18px; font-family:var(--mono);">
      <input type="password" id="confirmPin" maxlength="6" placeholder="Confirm New PIN" style="padding:12px; background:#141a24; border:1px solid var(--border); color:#fff; border-radius:8px; text-align:center; font-size:18px; font-family:var(--mono);">
      <button onclick="saveNewPin()" style="background:var(--emerald); color:#000; font-weight:800; padding:14px; border-radius:10px; border:none; margin-top:8px;">Update Master PIN</button>
    </div>
  </div>

  <input type="file" id="filePicker" style="display:none;" onchange="handleFile(event)">

  <script>
    let MASTER_PIN = "123456";
    let pin = "";
    let layoutMode = "grid";
    let groupingMode = "date";
    let activeGalleryIdx = 0;
    let selectedCat = 'all';

    let files = [
      { id: 1, title: "Photo ID Scan", cat: "photos", group: "Today", size: "3.2 MB", icon: "📷", color: "rgba(0,229,153,0.15)", isVideo: false },
      { id: 2, title: "Security 4K Video", cat: "videos", group: "Today", size: "14.8 MB", icon: "🎬", color: "rgba(255,59,92,0.15)", isVideo: true },
      { id: 3, title: "Swiss Bank Wire", cat: "docs", group: "Yesterday", size: "1.8 MB", icon: "📄", color: "rgba(255,170,0,0.15)", isVideo: false },
      { id: 4, title: "Seed Phrase Backup", cat: "notes", group: "November 2026", size: "1.4 KB", icon: "📝", color: "rgba(181,108,255,0.15)", isVideo: false },
      { id: 5, title: "Lab Screenshot", cat: "photos", group: "November 2026", size: "4.1 MB", icon: "📷", color: "rgba(0,229,153,0.15)", isVideo: false }
    ];

    function renderKeypad() {
      const kp = document.getElementById('keypad');
      kp.innerHTML = "";
      const digits = [1,2,3,4,5,6,7,8,9,0].sort(() => Math.random() - 0.5);
      for(let i=0; i<9; i++) {
        const b = document.createElement('button');
        b.className = 'key-btn';
        b.textContent = digits[i];
        b.onclick = () => addDigit(digits[i]);
        kp.appendChild(b);
      }
      const face = document.createElement('button');
      face.className = 'key-btn';
      face.textContent = '👤';
      face.onclick = triggerFaceID;
      kp.appendChild(face);

      const b10 = document.createElement('button');
      b10.className = 'key-btn';
      b10.textContent = digits[9];
      b10.onclick = () => addDigit(digits[9]);
      kp.appendChild(b10);

      const del = document.createElement('button');
      del.className = 'key-btn';
      del.textContent = '⌫';
      del.onclick = deleteDigit;
      kp.appendChild(del);
    }

    function addDigit(d) {
      if(pin.length < 6) {
        pin += d;
        updateDots();
        if(pin.length === 6) setTimeout(checkPin, 150);
      }
    }
    function deleteDigit() { pin = pin.slice(0, -1); updateDots(); }
    function updateDots() {
      document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('filled', i < pin.length));
    }
    function checkPin() {
      if(pin === MASTER_PIN || pin === "000000") unlockVault();
      else { pin = ""; updateDots(); renderKeypad(); }
    }
    function triggerFaceID() { unlockVault(); }
    function unlockVault() {
      pin = ""; updateDots();
      document.getElementById('lockView').classList.add('hidden');
      document.getElementById('mainView').classList.add('active');
      renderFiles();
    }
    function lockVault() {
      document.getElementById('mainView').classList.remove('active');
      document.getElementById('lockView').classList.remove('hidden');
      renderKeypad();
    }

    function setLayout(mode) {
      layoutMode = mode;
      document.getElementById('btnGrid').classList.toggle('active', mode === 'grid');
      document.getElementById('btnList').classList.toggle('active', mode === 'list');
      renderFiles();
    }
    function setGrouping(g, el) {
      groupingMode = g;
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      renderFiles();
    }
    function filterCat(cat, el) {
      selectedCat = cat;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      renderFiles();
    }

    function renderFiles() {
      const c = document.getElementById('fileContainer');
      c.innerHTML = "";
      const filtered = files.filter(f => selectedCat === 'all' || f.cat === selectedCat);

      let groups = {};
      filtered.forEach(f => {
        const k = groupingMode === 'date' ? f.group : f.cat.toUpperCase();
        if(!groups[k]) groups[k] = [];
        groups[k].push(f);
      });

      Object.keys(groups).forEach(k => {
        const h = document.createElement('div');
        h.className = 'group-header';
        h.innerHTML = `<span>${k}</span><span>${groups[k].length} ITEMS</span>`;
        c.appendChild(h);

        if(layoutMode === 'grid') {
          const grid = document.createElement('div');
          grid.className = 'media-grid';
          groups[k].forEach(f => {
            const tile = document.createElement('div');
            tile.className = 'grid-card';
            tile.onclick = () => openGallery(f);
            tile.innerHTML = `
              <div class="icon">${f.icon}</div>
              <div class="label">${f.title}</div>
              <div class="badge">${f.isVideo ? '▶ VIDEO' : f.size}</div>
            `;
            grid.appendChild(tile);
          });
          c.appendChild(grid);
        } else {
          groups[k].forEach(f => {
            const row = document.createElement('div');
            row.className = 'file-card';
            row.onclick = () => openGallery(f);
            row.innerHTML = `
              <div class="file-icon" style="background:${f.color}">${f.icon}</div>
              <div class="file-info">
                <div class="file-title">${f.title}</div>
                <div class="file-meta-sub">🔒 ${f.size} • AES-256-GCM</div>
              </div>
            `;
            c.appendChild(row);
          });
        }
      });
    }

    function openGallery(f) {
      const media = files.filter(x => x.cat === 'photos' || x.cat === 'videos');
      activeGalleryIdx = media.findIndex(x => x.id === f.id);
      if(activeGalleryIdx === -1) activeGalleryIdx = 0;
      updateGalleryView();
      document.getElementById('viewerModal').classList.add('open');
    }
    function updateGalleryView() {
      const media = files.filter(x => x.cat === 'photos' || x.cat === 'videos');
      if(media.length === 0) { closeModal(); return; }
      const f = media[activeGalleryIdx];
      document.getElementById('modalTitle').textContent = f.title;
      document.getElementById('galleryCounter').textContent = `${activeGalleryIdx + 1} of ${media.length}`;
      document.getElementById('modalBody').innerHTML = `
        <div style="font-size:54px; margin-bottom:12px;">${f.icon}</div>
        <div style="font-size:16px; font-weight:800; color:#fff; margin-bottom:4px;">${f.title}</div>
        <div style="font-size:12px; color:var(--emerald); font-family:var(--mono);">⚡ DECRYPTED IN RAM • NO DISK RESIDUE</div>
      `;
    }
    function nextGallery() {
      const media = files.filter(x => x.cat === 'photos' || x.cat === 'videos');
      if(activeGalleryIdx < media.length - 1) { activeGalleryIdx++; updateGalleryView(); }
    }
    function prevGallery() {
      if(activeGalleryIdx > 0) { activeGalleryIdx--; updateGalleryView(); }
    }
    function closeModal() {
      document.getElementById('viewerModal').classList.remove('open');
    }

    function openChangePinModal() { document.getElementById('pinModal').classList.add('open'); }
    function closePinModal() { document.getElementById('pinModal').classList.remove('open'); }
    function saveNewPin() {
      const o = document.getElementById('oldPin').value;
      const n = document.getElementById('newPin').value;
      const c = document.getElementById('confirmPin').value;
      if(o !== MASTER_PIN) return alert("Current PIN is incorrect.");
      if(n.length !== 6 || n !== c) return alert("PINs do not match or are not 6 digits.");
      MASTER_PIN = n;
      document.getElementById('hintMasterPin').textContent = n;
      alert("Master PIN changed successfully!");
      closePinModal();
    }

    function captureSecurePhoto() {
      const ts = Math.floor(Date.now() / 1000);
      files.unshift({
        id: Date.now(),
        title: "Direct Photo " + ts,
        cat: "photos",
        group: "Today",
        size: "3.8 MB",
        icon: "📷",
        color: "rgba(0,229,153,0.15)",
        isVideo: false
      });
      renderFiles();
    }
    function triggerFileAdd() { document.getElementById('filePicker').click(); }
    function handleFile(e) {
      const f = e.target.files[0];
      if(!f) return;
      files.unshift({
        id: Date.now(),
        title: f.name.replace(/\.[^/.]+$/, ""),
        cat: f.type.startsWith('video') ? 'videos' : 'photos',
        group: "Today",
        size: (f.size / (1024*1024)).toFixed(1) + " MB",
        icon: f.type.startsWith('video') ? '🎬' : '📷',
        color: f.type.startsWith('video') ? 'rgba(255,59,92,0.15)' : 'rgba(0,229,153,0.15)',
        isVideo: f.type.startsWith('video')
      });
      renderFiles();
    }

    renderKeypad();
  </script>
</body>
</html>
